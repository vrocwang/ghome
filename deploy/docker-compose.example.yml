# ghome under Docker Compose.
#
#   cp deploy/ghome.env.example deploy/ghome.env    # fill in the forge settings
#   docker compose -f deploy/docker-compose.example.yml up -d --build
#
# The image's own HEALTHCHECK is inherited, so `docker compose ps` reports the
# real state instead of just "running", and `depends_on: condition:
# service_healthy` works for whatever sits in front of it.

services:
  ghome:
    build:
      # The Dockerfile lives at the repository root.
      context: ..
    # Or pin a built image instead of building here:
    # image: registry.example.com/simon/ghome:latest
    container_name: ghome
    restart: unless-stopped

    env_file:
      - ./ghome.env
    environment:
      GHOME_CACHE_FILE: /data/cache.yaml

    volumes:
      # Keeps the last good config across restarts, so a restart while the
      # forge is unreachable still serves the page. A fresh named volume
      # inherits /data's ownership from the image, so the unprivileged user can
      # write to it without any chown on your side.
      - ghome-data:/data

      # Optional: serve the UI from disk instead of the embedded copy.
      # `ghome --dump-web=./web` writes a working starting point.
      #   GHOME_WEB_DIR: /srv/web
      # - ./web:/srv/web:ro

      # Optional: local icons, tried before fetching a site. The reliable fix
      # for internal services that have no favicon. Read access is enough.
      #   GHOME_ICON_DIR: /srv/icons
      # - ./icons:/srv/icons:ro

    ports:
      # Keep it on loopback and put a reverse proxy in front; the webhook
      # endpoint shares this port.
      - "127.0.0.1:8080:8080"

volumes:
  ghome-data:
